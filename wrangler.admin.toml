name = "ust-admin-bot"
main = "src/admin/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# تفعيل workers.dev URL
workers_dev = true

# Public non-secret vars
[vars]
BOT_USERNAME = "usttesteradminbot"
ENVIRONMENT = "production"
WORKERS_SUBDOMAIN = "atow73768"

# ============================================
# KV Namespaces (للجلسات والـ cache)
# ============================================
# تم إنشاؤها في Cloudflare — IDs حقيقية
# ============================================

# KV لجلسات المسؤولين (حالة await upload، broadcast context، إلخ)
# Namespace: UST_ADMIN_SESSIONS
[[kv_namespaces]]
binding = "SESSIONS"
id = "fc1b3d84b987471ca4ef51a2bf9eb11c"

# KV للـ cache (الصلاحيات، الكليات، التخصصات)
# Namespace: UST_ADMIN_CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "0d0fbffb56f04907b68bb68c51aac9de"

# ============================================
# Secrets (تُحدد عبر wrangler secret put)
# ============================================
# Secret: BOT_TOKEN
# لتعيينه: echo "TOKEN" | npx wrangler secret put BOT_TOKEN --config wrangler.admin.toml
#
# Secret: SUPABASE_URL
# لتعيينه: echo "https://xxx.supabase.co" | npx wrangler secret put SUPABASE_URL --config wrangler.admin.toml
#
# Secret: SUPABASE_SERVICE_KEY
# لتعيينه: echo "eyJhbGc..." | npx wrangler secret put SUPABASE_SERVICE_KEY --config wrangler.admin.toml
#
# Secret: CALLBACK_SECRET (لتوقيع callback_data بـ HMAC-SHA256)
# توليد secret: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
# لتعيينه: echo "GENERATED_SECRET" | npx wrangler secret put CALLBACK_SECRET --config wrangler.admin.toml
# ⚠️ مهم: استخدم نفس الـ secret لكلا البوتين (student + admin)

# ============================================
# Cron Triggers (للتنبيه المتدرّج — فحص كل ساعة)
# ============================================
# يفحص الإحسانات المتأخرة كل ساعة:
#   24 ساعة → تذكير مسؤول المستوى
#   48 ساعة → تنبيه مسؤول الكلية
#   72 ساعة → تنبيه المسؤول المركزي
[triggers]
crons = ["0 * * * *"]
