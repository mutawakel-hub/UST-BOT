# ============================================
# 🗄️ Database Migration Sync
# ============================================
# عند أي تعديل على db/schema.sql، يُطبَّق تلقائياً على Supabase
# عبر Supabase CLI (وليس PostgREST RPC الذي لا يدعم DDL)
#
# المتطلبات:
#   - SUPABASE_ACCESS_TOKEN في GitHub Secrets (من Supabase Dashboard → Account → Access Tokens)
#   - SUPABASE_PROJECT_REF في GitHub Secrets (من Project Settings → General → Reference ID)
# ============================================

name: 🗄️ Sync Database Schema

on:
  push:
    branches: [main]
    paths:
      - "db/schema.sql"
      - "db/migrations/**"
  workflow_dispatch:

jobs:
  sync-schema:
    name: 📦 Sync Schema to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🗄️ Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🔑 Verify secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN not set in GitHub Secrets"
            echo "   Get it from: https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "❌ SUPABASE_PROJECT_REF not set in GitHub Secrets"
            echo "   Get it from: Supabase Dashboard → Project Settings → General → Reference ID"
            exit 1
          fi
          echo "✅ All secrets are set"

      - name: 📦 Apply schema.sql to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "📦 تطبيق db/schema.sql على Supabase..."

          # استخدم Supabase CLI لتنفيذ SQL عبر Management API
          # (يدعم DDL: CREATE TABLE, ALTER, CREATE FUNCTION, إلخ)
          supabase db execute \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --file db/schema.sql

          echo "✅ تم تطبيق الـ schema بنجاح!"

      - name: 📊 Apply storage channels update
        if: hashFiles('db/update_storage_channels.sql') != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "📡 تحديث قنوات التخزين..."
          supabase db execute \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --file db/update_storage_channels.sql || true
          echo "✅ تم تحديث قنوات التخزين"

      - name: ✅ Summary
        run: |
          echo "============================================"
          echo "✅ Database Sync Complete"
          echo "============================================"
          echo ""
          echo "📋 التغييرات المطبقة:"
          echo "   - db/schema.sql (24 جدول + 8 Functions)"
          echo "   - db/update_storage_channels.sql (7 قنوات تخزين)"
          echo ""
          echo "🔗 Supabase Dashboard:"
          echo "   https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROJECT_REF }}"
