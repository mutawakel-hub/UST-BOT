# ============================================
# 🗄️ Database Migration Sync
# ============================================
# عند أي تعديل على db/schema.sql، يُطبَّق تلقائياً على Supabase
# عبر psql (الأداة الرسمية لـ PostgreSQL)
#
# المتطلبات (في GitHub Secrets):
#   - SUPABASE_DB_URL: connection string بصيغة postgresql://...
#     (من Supabase Dashboard → Project Settings → Database → Connection string → URI)
#   مثال: postgresql://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
# ============================================

name: 🗄️ Sync Database Schema

on:
  push:
    branches: [main]
    paths:
      - "db/schema.sql"
      - "db/migrations/**"
      - "db/update_storage_channels.sql"
  workflow_dispatch:

jobs:
  sync-schema:
    name: 📦 Sync Schema to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔑 Verify secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "❌ SUPABASE_DB_URL not set in GitHub Secrets"
            echo ""
            echo "📋 How to get it:"
            echo "   1. Go to: https://supabase.com/dashboard/project/_/settings/database"
            echo "   2. Find 'Connection string' → 'URI' section"
            echo "   3. Copy the connection string (starts with postgresql://)"
            echo "   4. Replace [YOUR-PASSWORD] with your database password"
            echo "   5. Add as GitHub Secret: SUPABASE_DB_URL"
            echo ""
            echo "⚠️  Until this is set, schema changes must be applied manually via SQL Editor."
            exit 0
          fi
          echo "✅ SUPABASE_DB_URL is set"

      - name: 🗄️ Install PostgreSQL client
        if: env.SUPABASE_DB_URL != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: 📦 Apply schema.sql to Supabase
        if: env.SUPABASE_DB_URL != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "📦 تطبيق db/schema.sql على Supabase..."
          PGPASSWORD="${SUPABASE_DB_URL#*@}" \
          psql "${SUPABASE_DB_URL}" \
            -v ON_ERROR_STOP=1 \
            -f db/schema.sql
          echo "✅ تم تطبيق الـ schema بنجاح!"

      - name: 📊 Apply storage channels update
        if: env.SUPABASE_DB_URL != '' && hashFiles('db/update_storage_channels.sql') != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "📡 تحديث قنوات التخزين..."
          psql "${SUPABASE_DB_URL}" \
            -v ON_ERROR_STOP=1 \
            -f db/update_storage_channels.sql || true
          echo "✅ تم تحديث قنوات التخزين"

      - name: ✅ Verify schema
        if: env.SUPABASE_DB_URL != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "📊 التحقق من الجداول..."
          psql "${SUPABASE_DB_URL}" -c "
            SELECT table_name
            FROM information_schema.tables
            WHERE table_schema = 'public'
            ORDER BY table_name;
          " || true

      - name: ✅ Summary
        run: |
          echo "============================================"
          echo "✅ Database Sync Complete"
          echo "============================================"
          echo ""
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "⚠️  SUPABASE_DB_URL not set — schema not applied automatically"
            echo ""
            echo "📋 Manual steps:"
            echo "   1. Open Supabase SQL Editor"
            echo "   2. Copy & paste db/schema.sql"
            echo "   3. Click Run"
            echo "   4. Repeat for db/update_storage_channels.sql"
          else
            echo "✅ Schema applied successfully"
            echo "✅ Storage channels updated"
          fi
