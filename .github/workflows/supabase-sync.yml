# ============================================
# 🗄️ Supabase Migration Sync
# ============================================
# عند أي تعديل على db/schema.sql، يُطبَّق تلقائياً على Supabase
# ============================================

name: 🗄️ Sync Database Schema

on:
  push:
    branches: [main]
    paths:
      - "db/schema.sql"
      - "db/cleanup.sql"
  workflow_dispatch:

jobs:
  sync-schema:
    name: 📦 Sync Schema to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🗄️ Apply Schema to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "📦 تطبيق db/schema.sql على Supabase..."

          # قراءة ملف الـ schema
          SCHEMA=$(cat db/schema.sql)

          # تطبيق عبر Supabase REST API (SQL endpoint)
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/exec_sql" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"sql\": \"$(echo "$SCHEMA" | jq -Rs .)\"}" 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ تم تطبيق الـ schema بنجاح!"
          else
            echo "⚠️ قد لا يدعم Supabase RPC مباشرة. استخدم SQL Editor يدوياً."
            echo "📋 ملاحظة: في الإنتاج، استخدم Supabase CLI أو Migration Tools."
            echo "   للآن، الـ schema يُطبَّق يدوياً عبر SQL Editor."
          fi

      - name: ✅ Summary
        run: |
          echo "============================================"
          echo "✅ Database Sync Complete"
          echo "============================================"
          echo "📋 ملاحظة: للتحديثات المستقبلية على db/schema.sql:"
          echo "   1. عدّل الملف محلياً"
          echo "   2. git push"
          echo "   3. راجع Supabase Dashboard للتأكد"
          echo ""
          echo "💡 في الإنتاج: استخدم Supabase CLI للت migrations التلقائية"
          echo "   npx supabase db push"
          echo "============================================"
