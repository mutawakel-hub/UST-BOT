# ============================================
# 🚀 UST Central Bot - Auto-Deploy to Cloudflare Workers
# ============================================
# هذا الـ Workflow يُشغّل تلقائياً عند كل push على branch main
# وينشر البوتين على Cloudflare Workers
#
# Pipeline:
#   1. 🧪 Tests (Vitest) — يفشل النشر لو فشل أي اختبار
#   2. 🔍 Type Check (tsc --noEmit) — يفشل النشر لو فيه أخطاء أنواع
#   3. 🚀 Deploy (parallel): student + admin + pdf-server
#   4. 📊 Summary
# ============================================

name: 🚀 Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: # يسمح بالتشغيل اليدوي من GitHub UI

jobs:
  # ============================================
  # 1. اختبارات الوحدة (Vitest)
  # ============================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🧪 Run Vitest
        run: npm test

      - name: 📊 Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # 2. فحص الأنواع (TypeScript)
  # ============================================
  typecheck:
    name: 🔍 Type Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 TypeScript type check
        run: npx tsc --noEmit

  # ============================================
  # 3. نشر بوت الطالب
  # ============================================
  deploy-student-bot:
    name: 🎓 Deploy Student Bot
    needs: [test, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🚀 Deploy Student Bot to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.student.toml

  # ============================================
  # 4. نشر بوت الإدارة
  # ============================================
  deploy-admin-bot:
    name: 🛡 Deploy Admin Bot
    needs: [test, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🚀 Deploy Admin Bot to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.admin.toml

  # ============================================
  # 5. نشر PDF Server
  # ============================================
  deploy-pdf-server:
    name: 📄 Deploy PDF Server
    needs: [test, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🚀 Deploy PDF Server to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config pdf-server/wrangler.toml

  # ============================================
  # 6. ملخص النشر
  # ============================================
  summary:
    name: ✅ Deployment Summary
    needs: [deploy-student-bot, deploy-admin-bot, deploy-pdf-server]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📊 Status Summary
        run: |
          echo "============================================"
          echo "🎉 Deployment Summary - UST Central Bot v3.3"
          echo "============================================"
          echo ""
          echo "Tests:       ${{ needs.test.result }}"
          echo "Type Check:  ${{ needs.typecheck.result }}"
          echo "Student Bot: ${{ needs.deploy-student-bot.result }}"
          echo "Admin Bot:   ${{ needs.deploy-admin-bot.result }}"
          echo "PDF Server:  ${{ needs.deploy-pdf-server.result }}"
          echo ""
          if [ "${{ needs.deploy-student-bot.result }}" = "success" ] && \
             [ "${{ needs.deploy-admin-bot.result }}" = "success" ] && \
             [ "${{ needs.deploy-pdf-server.result }}" = "success" ]; then
            echo "✅ All deployments succeeded!"
          else
            echo "⚠️ Some deployments failed. Check the logs above."
            exit 1
          fi
